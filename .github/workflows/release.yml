name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0). Must match MARKETING_VERSION in Config/Version.xcconfig."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "error: tag must look like v1.0" >&2
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "error: tag $TAG already exists" >&2
            exit 1
          fi

          source scripts/read-version.sh
          EXPECTED_TAG="v${MARKETING_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "error: tag $TAG does not match Config/Version.xcconfig ($EXPECTED_TAG)" >&2
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Creating release $TAG (version $MARKETING_VERSION, build $BUILD_NUMBER)"

      - name: Build release DMG
        run: ./scripts/build-release.sh

      - name: Generate release notes
        env:
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-version:refname | head -1 || true)"
          ./scripts/generate-release-notes.sh dist/release-notes.md "$PREV_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          VERSION="${{ steps.version.outputs.marketing_version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          gh release create "$TAG" \
            --title "Cue ${VERSION} (build ${BUILD})" \
            --notes-file dist/release-notes.md \
            "dist/Cue-${VERSION}.dmg#Cue-${VERSION}.dmg"
