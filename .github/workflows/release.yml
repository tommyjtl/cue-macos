name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          source scripts/read-version.sh
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if release tag already exists
        id: gate
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Preparing new release $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release DMG
        if: steps.gate.outputs.should_release == 'true'
        run: ./scripts/build-release.sh

      - name: Generate release notes
        if: steps.gate.outputs.should_release == 'true'
        env:
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-version:refname | head -1 || true)"
          ./scripts/generate-release-notes.sh dist/release-notes.md "$PREV_TAG"

      - name: Create GitHub Release
        if: steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          VERSION="${{ steps.version.outputs.marketing_version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          gh release create "$TAG" \
            --title "Cue ${VERSION} (build ${BUILD})" \
            --notes-file dist/release-notes.md \
            "dist/Cue-${VERSION}.dmg#Cue-${VERSION}.dmg"
