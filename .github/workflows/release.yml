name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0). Must match MARKETING_VERSION in Config/Version.xcconfig."
        required: true
        type: string
      generate_release_notes:
        description: "Generate release notes"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    # Cue requires Xcode 26+ (Swift 6 / project settings). macos-15 ships Xcode 16.x.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate release tag
        id: version
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "error: tag must look like v1.0" >&2
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "error: tag $TAG already exists" >&2
            exit 1
          fi

          source scripts/read-version.sh
          EXPECTED_TAG="v${MARKETING_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "error: tag $TAG does not match Config/Version.xcconfig ($EXPECTED_TAG)" >&2
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Creating release $TAG (version $MARKETING_VERSION, build $BUILD_NUMBER)"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-signing-certificate.sh

      - name: Build release DMG
        env:
          RELEASE_SIGN: "1"
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        run: |
          if [[ -n "$APPLE_NOTARIZATION_PASSWORD" ]]; then
            export NOTARIZE_RELEASE=1
          fi
          ./scripts/build-release.sh

      - name: Generate release notes
        env:
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-version:refname | head -1 || true)"
          if [[ "${{ github.event.inputs.generate_release_notes }}" == "true" ]]; then
            ./scripts/generate-release-notes.sh dist/release-notes.md "$PREV_TAG"
          else
            ./scripts/generate-release-notes.sh --basic dist/release-notes.md "$PREV_TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          VERSION="${{ steps.version.outputs.marketing_version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          gh release create "$TAG" \
            --title "Cue ${VERSION} (build ${BUILD})" \
            --notes-file dist/release-notes.md \
            "dist/Cue-${VERSION}.dmg#Cue-${VERSION}.dmg"
