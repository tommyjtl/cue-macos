name: Version check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  marketing-version:
    name: Not behind main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Compare MARKETING_VERSION to main
        run: ./scripts/check-marketing-version.sh "origin/${{ github.base_ref }}"
